# Kubernetes Observability Examples
# Probes, HPA, ResourceQuotas, LimitRanges, Monitoring

---
# ============================================
# 1. Pod with ALL Probe Types
# ============================================
apiVersion: v1
kind: Pod
metadata:
  name: probed-app
spec:
  containers:
  - name: app
    image: nginx:1.27-alpine
    ports:
    - containerPort: 80

    # STARTUP PROBE — Check if app has finished initializing
    # All other probes are disabled until this succeeds
    startupProbe:
      httpGet:
        path: /healthz
        port: 80
      failureThreshold: 30     # 30 * 10s = 5 min max startup time
      periodSeconds: 10

    # READINESS PROBE — Is the app ready to receive traffic?
    # Failing = removed from Service endpoints
    readinessProbe:
      httpGet:
        path: /ready
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3
      successThreshold: 1

    # LIVENESS PROBE — Is the app still alive?
    # Failing = container is restarted
    livenessProbe:
      httpGet:
        path: /healthz
        port: 80
      initialDelaySeconds: 15
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 5

---
# ============================================
# 2. Probes — Different Methods
# ============================================

# TCP Socket Probe (for non-HTTP services)
apiVersion: v1
kind: Pod
metadata:
  name: tcp-probe-pod
spec:
  containers:
  - name: db
    image: postgres:16-alpine
    ports:
    - containerPort: 5432
    readinessProbe:
      tcpSocket:
        port: 5432
      initialDelaySeconds: 10
      periodSeconds: 5
    livenessProbe:
      tcpSocket:
        port: 5432
      initialDelaySeconds: 15
      periodSeconds: 10

---
# Exec Probe (custom check command)
apiVersion: v1
kind: Pod
metadata:
  name: exec-probe-pod
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ['sh', '-c', 'touch /tmp/healthy && sleep 3600']
    livenessProbe:
      exec:
        command:
        - cat
        - /tmp/healthy
      initialDelaySeconds: 5
      periodSeconds: 5

---
# gRPC Probe (K8s 1.27+)
apiVersion: v1
kind: Pod
metadata:
  name: grpc-probe-pod
spec:
  containers:
  - name: grpc-app
    image: my-grpc-app:latest
    ports:
    - containerPort: 50051
    readinessProbe:
      grpc:
        port: 50051
        service: ""           # Empty = check overall server health
      initialDelaySeconds: 5
      periodSeconds: 10

---
# ============================================
# 3. Horizontal Pod Autoscaler (HPA)
# ============================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webapp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webapp
  minReplicas: 2
  maxReplicas: 10
  metrics:
  # Scale based on CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70    # Scale when avg CPU > 70%
  # Scale based on memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max

---
# ============================================
# 4. ResourceQuota — Namespace limits
# ============================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: development
spec:
  hard:
    # Compute resources
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    # Object count
    pods: "20"
    services: "10"
    persistentvolumeclaims: "10"
    configmaps: "20"
    secrets: "20"
    services.nodeports: "2"
    services.loadbalancers: "1"

---
# ============================================
# 5. LimitRange — Default resource limits for pods
# ============================================
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: development
spec:
  limits:
  # Default limits/requests for containers
  - type: Container
    default:               # Default limits (if not specified)
      cpu: 500m
      memory: 512Mi
    defaultRequest:        # Default requests (if not specified)
      cpu: 100m
      memory: 128Mi
    max:                   # Maximum allowed
      cpu: "2"
      memory: 2Gi
    min:                   # Minimum allowed
      cpu: 50m
      memory: 64Mi
  # Limits for pods (sum of all containers)
  - type: Pod
    max:
      cpu: "4"
      memory: 4Gi
  # PVC size limits
  - type: PersistentVolumeClaim
    max:
      storage: 50Gi
    min:
      storage: 1Gi

---
# ============================================
# 6. PodDisruptionBudget — Availability during disruptions
# ============================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webapp-pdb
spec:
  minAvailable: 2              # OR use maxUnavailable: 1
  selector:
    matchLabels:
      app: webapp

---
# ============================================
# 7. Priority Class — Pod scheduling priority
# ============================================
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "High priority for critical workloads"

---
# Pod using PriorityClass
apiVersion: v1
kind: Pod
metadata:
  name: critical-app
spec:
  priorityClassName: high-priority
  containers:
  - name: app
    image: nginx:1.27-alpine
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

---
# ============================================
# 8. Pod Topology Spread Constraints
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: balanced-webapp
spec:
  replicas: 6
  selector:
    matchLabels:
      app: balanced-webapp
  template:
    metadata:
      labels:
        app: balanced-webapp
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: balanced-webapp
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: balanced-webapp
      containers:
      - name: app
        image: nginx:1.27-alpine
        resources:
          requests:
            cpu: 100m
            memory: 128Mi

